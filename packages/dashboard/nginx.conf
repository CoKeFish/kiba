# Dashboard (app.kiba.tools) en producción: SPA estática + reescrituras internas
# equivalentes a las que hacía vercel.json (/api → gateway, /backend → backend).
# Traefik (Coolify) termina TLS delante; aquí solo HTTP en el puerto 80.

# DNS interno de Docker: con proxy_pass por variable nginx re-resuelve el nombre
# y no se queda con una IP vieja si un contenedor se recrea.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    # /api/* → gateway (sin el prefijo), igual que el rewrite que tenía Vercel.
    location ^~ /api/ {
        set $gateway http://gateway:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host api.kiba.tools;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;      # SSE / respuestas largas
        proxy_read_timeout 300s;  # call_agent puede tardar >60 s (Trustless Work)
    }

    # /backend/* → backend (sin el prefijo).
    location ^~ /backend/ {
        set $backend http://backend:4000;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host data.kiba.tools;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Assets con hash en el nombre → cache larga.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html nunca se cachea (apunta a los assets con hash).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Archivos con extensión que no existen → 404 (no index.html), como en Vercel.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # SPA: cualquier ruta sin archivo cae en index.html.
    location / {
        try_files $uri /index.html;
    }
}
