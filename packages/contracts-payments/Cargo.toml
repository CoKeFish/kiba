[package]
name = "kiba-payments"
version = "0.1.0"
edition = "2021"
description = "Kiba — pagos en USDC con split de la plataforma: pago directo, escrow por llamada y canal de pago con vales, sobre Soroban (Stellar)."
license = "MIT"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = "22"

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }
ed25519-dalek = "2"

# Perfil de release recomendado para contratos Soroban: binario wasm pequeño y
# con overflow-checks activos (seguridad aritmética en el split de pagos).
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
