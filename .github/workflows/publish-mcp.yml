name: publish-kiba-mcp

# Publica packages/mcp-server (kiba-mcp) en npm al pushear un tag `mcp-v*`.
# Autenticación por Trusted Publishing (OIDC): npm confía en ESTE workflow de
# ESTE repo, sin tokens ni secrets (NPM_TOKEN ya no se usa). Requiere que en
# npmjs.com → paquete kiba-mcp → Settings → Trusted Publisher esté configurado
# GitHub Actions con user `CoKeFish`, repo `kiba`, workflow `publish-mcp.yml`.
# El OIDC exige npm >= 11.5.1 (Node 24 lo trae) y `id-token: write`.
#
# Para liberar una versión:
#   1) sube "version" en packages/mcp-server/package.json
#   2) commit + push a main
#   3) git tag mcp-v<version> && git push origin mcp-v<version>
#   (o `gh workflow run publish-mcp.yml --ref main` si el tag ya existe)

on:
  push:
    tags:
      - 'mcp-v*'
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC para Trusted Publishing + provenance
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
