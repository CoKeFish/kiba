name: deploy

# CI/CD de Kiba.
#   Frontends (Astro landing, Vite dashboard) -> Vercel
#   Backends  (stack docker-compose.prod.yml: gateway, backend, postgres,
#              8 demo-agents)                 -> Coolify (VPS, webhook de deploy)
# Cada push a main: corre tests + escaneo de secretos, y despliega SOLO los
# paquetes que cambiaron. En pull_request corre tests + gitleaks (sin desplegar).
#
# Secrets requeridos en el repo (Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN      Token de Vercel  (https://vercel.com/account/tokens)
#   COOLIFY_TOKEN     API token de Coolify (panel -> Keys & Tokens)
#   COOLIFY_APP_UUID  UUID de la aplicación compose "kiba" en Coolify
# Los IDs de Vercel (org/project) NO son secretos y van inline abajo.

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_9ih8tHa4Rdt6QMgOLYFGnBAx

jobs:
  # ---- ¿Qué cambió? --------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.f.outputs.landing }}
      dashboard: ${{ steps.f.outputs.dashboard }}
      stack: ${{ steps.f.outputs.stack }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            landing:
              - 'packages/landing/**'
            dashboard:
              - 'packages/dashboard/**'
            stack:
              - 'packages/backend/**'
              - 'packages/gateway/**'
              - 'packages/demo-agents/**'
              - 'packages/sdk/**'
              - 'package-lock.json'
              - 'docker-compose.prod.yml'
              - 'docker/**'
              - 'scripts/agent-entrypoint.sh'

  # ---- Escaneo de secretos (gate de los deploys) ---------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historia completa para escanear todos los commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gratis para cuentas personales. Si el repo pasa a una organización,
          # añadir el secret GITLEAKS_LICENSE (https://gitleaks.io/products.html).

  # ---- Tests (gate de los deploys) -----------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      # Postgres de test para el gateway (migrado de SQLite a pg).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run workspace tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/kiba_test
        run: npm test --workspaces --if-present

  # ---- Vercel: landing -----------------------------------------------------
  deploy-landing:
    needs: [changes, gitleaks, test]
    if: needs.changes.outputs.landing == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/landing
    env:
      VERCEL_PROJECT_ID: prj_gLOztq0RbVqTKyIaf5skUBkIDtW3
    steps:
      - uses: actions/checkout@v5
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ---- Vercel: dashboard ---------------------------------------------------
  deploy-dashboard:
    needs: [changes, gitleaks, test]
    if: needs.changes.outputs.dashboard == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dashboard
    env:
      VERCEL_PROJECT_ID: prj_rAW3qHsRmUw9UavD37nRaMZxG2qC
    steps:
      - uses: actions/checkout@v5
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ---- Coolify: stack de backends (compose en el VPS) ----------------------
  # Un solo job: Coolify hace pull del repo y reconstruye los servicios del
  # docker-compose.prod.yml (el build cache de Docker amortigua los no cambiados).
  deploy-stack:
    needs: [changes, gitleaks, test]
    if: needs.changes.outputs.stack == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "https://coolify.rodion.com.co/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false"
