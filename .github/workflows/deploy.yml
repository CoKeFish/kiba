name: deploy

# CI/CD de Kiba.
#   TODO el producto corre en Coolify (VPS) como UN stack docker-compose
#   (docker-compose.prod.yml: gateway, backend, postgres, 8 demo-agents,
#   landing, dashboard, docs) desplegado por webhook.
#   Vercel ya no sirve nada: solo redirige las URLs viejas *.vercel.app
#   (ver docs/DEPLOYMENT.md § Vercel).
# Cada push a main: corre tests + escaneo de secretos, y despliega el stack
# SOLO si cambió algo que lo afecta. En pull_request corre tests + gitleaks
# (sin desplegar).
#
# Secrets requeridos en el repo (Settings -> Secrets and variables -> Actions):
#   COOLIFY_TOKEN     API token de Coolify (panel -> Keys & Tokens)
#   COOLIFY_APP_UUID  UUID de la aplicación compose "kiba" en Coolify

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- ¿Qué cambió? --------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.f.outputs.stack }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: f
        with:
          filters: |
            stack:
              - 'packages/backend/**'
              - 'packages/gateway/**'
              - 'packages/demo-agents/**'
              - 'packages/sdk/**'
              - 'packages/landing/**'
              - 'packages/dashboard/**'
              - 'packages/docs/**'
              - 'package-lock.json'
              - 'docker-compose.prod.yml'
              - 'docker/**'
              - 'scripts/agent-entrypoint.sh'

  # ---- Escaneo de secretos (gate de los deploys) ---------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historia completa para escanear todos los commits
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Gratis para cuentas personales. Si el repo pasa a una organización,
          # añadir el secret GITLEAKS_LICENSE (https://gitleaks.io/products.html).

  # ---- Tests (gate de los deploys) -----------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      # Postgres de test para el gateway (migrado de SQLite a pg).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run workspace tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/kiba_test
        run: npm test --workspaces --if-present

  # ---- Coolify: el stack completo (compose en el VPS) ----------------------
  # Un solo job: Coolify hace pull del repo y reconstruye los servicios del
  # docker-compose.prod.yml (el build cache de Docker amortigua los no cambiados).
  deploy-stack:
    needs: [changes, gitleaks, test]
    if: needs.changes.outputs.stack == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploy
        # Desde Coolify 4.4.x el endpoint /deploy solo acepta POST (GET -> 405).
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "https://coolify.rodion.com.co/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}&force=false"
