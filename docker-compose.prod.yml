# ============================================================================
# Stack de PRODUCCIÓN de Kiba en Coolify (VPS). NO usar en local:
# los demo-agents re-registran su endpoint on-chain al arrancar y PISAN prod.
#
# Secretos: Doppler, proyecto `kiba`, config `prd`. Coolify inyecta UNA sola
# variable (${DOPPLER_TOKEN}); cada contenedor resuelve el resto en runtime
# vía `doppler run` (ver Dockerfile.coolify de cada servicio).
# Topología no-secreta (puertos, endpoints públicos, URLs internas) vive AQUÍ.
# No duplicar claves entre compose y Doppler: doppler run pisa en colisión.
#
# Traefik (Coolify) enruta por la red interna; los dominios por servicio se
# configuran en Coolify (gateway → api.kiba.tools:8000, landing → kiba.tools:4321,
# dashboard → app.kiba.tools:80, etc.; workflow coolify-domains.yml).
# ============================================================================
services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - POSTGRES_USER=kiba
      - POSTGRES_DB=kiba
      # POSTGRES_PASSWORD llega vía doppler run
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiba -d kiba"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.coolify
    labels:
      # Dominio viejo → nuevo (redirección; ver "Dominios" en docs/DEPLOYMENT.md)
      - traefik.http.middlewares.legacy-backend.redirectregex.regex=^https?://kiba-data[.]suchima[.]com
      - traefik.http.middlewares.legacy-backend.redirectregex.replacement=https://data.kiba.tools
      - traefik.http.middlewares.legacy-backend.redirectregex.permanent=true
      - traefik.http.routers.legacy-backend.rule=Host(`kiba-data.suchima.com`)
      - traefik.http.routers.legacy-backend.entryPoints=https
      - traefik.http.routers.legacy-backend.tls=true
      - traefik.http.routers.legacy-backend.tls.certresolver=letsencrypt
      - traefik.http.routers.legacy-backend.priority=1000
      - traefik.http.routers.legacy-backend.middlewares=legacy-backend
      - traefik.http.routers.legacy-backend.service=noop@internal
      - traefik.http.routers.legacy-backend-http.rule=Host(`kiba-data.suchima.com`)
      - traefik.http.routers.legacy-backend-http.entryPoints=http
      - traefik.http.routers.legacy-backend-http.priority=1000
      - traefik.http.routers.legacy-backend-http.middlewares=legacy-backend
      - traefik.http.routers.legacy-backend-http.service=noop@internal
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - NODE_ENV=production
      - PORT=4000
    volumes:
      - backend-data:/app/packages/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s # primer boot descarga los modelos transformers al volumen

  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile.coolify
    labels:
      # Dominio viejo → nuevo (redirección; ver "Dominios" en docs/DEPLOYMENT.md)
      - traefik.http.middlewares.legacy-gateway.redirectregex.regex=^https?://kiba-api[.]suchima[.]com
      - traefik.http.middlewares.legacy-gateway.redirectregex.replacement=https://api.kiba.tools
      - traefik.http.middlewares.legacy-gateway.redirectregex.permanent=true
      - traefik.http.routers.legacy-gateway.rule=Host(`kiba-api.suchima.com`)
      - traefik.http.routers.legacy-gateway.entryPoints=https
      - traefik.http.routers.legacy-gateway.tls=true
      - traefik.http.routers.legacy-gateway.tls.certresolver=letsencrypt
      - traefik.http.routers.legacy-gateway.priority=1000
      - traefik.http.routers.legacy-gateway.middlewares=legacy-gateway
      - traefik.http.routers.legacy-gateway.service=noop@internal
      - traefik.http.routers.legacy-gateway-http.rule=Host(`kiba-api.suchima.com`)
      - traefik.http.routers.legacy-gateway-http.entryPoints=http
      - traefik.http.routers.legacy-gateway-http.priority=1000
      - traefik.http.routers.legacy-gateway-http.middlewares=legacy-gateway
      - traefik.http.routers.legacy-gateway-http.service=noop@internal
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN}
      - NODE_ENV=production
      - PORT=8000
      - PUBLIC_URL=https://api.kiba.tools
      - PUBLIC_DASHBOARD_URL=https://app.kiba.tools
      - BACKEND_URL=http://backend:4000
      - CORS_ORIGINS=https://app.kiba.tools,https://kiba.tools
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

