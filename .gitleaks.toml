# Gitleaks (CI, gate de los deploys): reglas por defecto más una lista blanca para lo que no es
# un secreto pero la regla generic-api-key confunde: referencias a variables de entorno.
[extend]
useDefault = true

[allowlist]
description = "Referencias a variables de entorno (process.env.X, env.X) no son secretos"
regexes = [
  '''process\.env\.[A-Z0-9_]+''',
  '''\benv\.[A-Z0-9_]+''',
  # Texto fijo de una prueba (e2e-mpp.mts): la clave del vendedor de mentira, no un secreto.
  '''vendedor-oficial-de-prueba-0123456789abcdef''',
]
